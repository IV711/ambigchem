[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambigchem"
version = "0.1.1"
description = "A disambiguation-first chemistry name and formula resolution library"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Madumitha I V", email = "madumithaot7@gmail.com"}
]
requires-python = ">=3.9"
dependencies = ["ase>=3.22", "marisa-trie>=1.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.scripts]
ambigchem = "ambigchem.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]
organic = ["py2opsin>=1.2.0", "rdkit>=2023.0"]

[tool.setuptools.packages.find]
where = ["src"]
